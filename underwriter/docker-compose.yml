version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: underwriter-postgres
    environment:
      POSTGRES_DB: underwriter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: